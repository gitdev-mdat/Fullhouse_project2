<div class="menu-container" th:fragment="menu"
     xmlns:th="http://www.thymeleaf.org"
>
    <div class="navbar-buttons navbar-header pull-right">
        <ul class="nav ace-nav">

            <!-- Chỉ hiển thị khi đã login -->
            <li class="light-10" sec:authorize="isAuthenticated()">
                <a data-toggle="dropdown" href="#" class="dropdown-toggle">

                    <!-- Avatar -->
                    <img class="nav-user-photo" alt="avatar"
                         th:src="@{|/admin/users/userImage?userName=${#authentication?.name}|}"
                         onerror="this.onerror=null;this.src='/admin/assets/avatars/user.jpg';"/>

                    <span class="user-info">
                    <small>
                        Welcome,
                        <span sec:authentication="name"></span>
                    </small>
                </span>

                    <i class="ace-icon fa fa-caret-down"></i>
                </a>

                <ul class="user-menu dropdown-menu-right dropdown-menu dropdown-yellow dropdown-caret dropdown-close">
                    <li>
                        <a th:href="@{|/admin/users/${#authentication?.name}|}">
                            <i class="ace-icon fa fa-user"></i> Thông tin tài khoản
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="ace-icon fa fa-key"></i> Đổi mật khẩu
                        </a>
                    </li>

                    <li class="divider"></li>

                    <li>
                        <a th:href="@{/logout}">
                            <i class="ace-icon fa fa-power-off"></i> Thoát
                        </a>
                    </li>
                </ul>
            </li>

        </ul>
    </div>
</div>
